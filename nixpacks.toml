[phases.setup]
nixPkgs = ["...", "php83", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.tokenizer", "php83Extensions.xml", "php83Extensions.ctype", "php83Extensions.openssl", "php83Extensions.bcmath", "php83Extensions.curl", "php83Extensions.fileinfo"]

[phases.install]
cmds = [
    "mkdir -p /etc/php83",
    "cp /etc/php83/php.ini /etc/php83/php.ini.bak 2>/dev/null || true",
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build"
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
